[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-mcp"
version = "0.1.0"
description = "Simple MCP server project"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
]

[project.scripts]
my-mcp-server = "my_mcp.server:main"